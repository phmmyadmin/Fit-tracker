<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0C29" />
    </linearGradient>

    <!-- Ring Gradients -->
    <linearGradient id="macroRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Flame / Energy Center Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#F09819" />
      <stop offset="100%" stop-color="#FFD200" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Outer Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#macroRingGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Macro Ring Track (Background) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1E293B" stroke-width="28" stroke-linecap="round" />

  <!-- Progress Macro Ring (Multi-color vibrant ring) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#macroRingGrad)" stroke-width="28" stroke-dasharray="1068" stroke-dashoffset="180" stroke-linecap="round" transform="rotate(-90 256 256)" filter="url(#ringGlow)" />

  <!-- Inner Dark Glass Disc -->
  <circle cx="256" cy="256" r="132" fill="#090D16" fill-opacity="0.85" stroke="#334155" stroke-width="2" />

  <!-- Center Emblem: Fitness Flame + Nutrition Leaf Motif -->
  <g filter="url(#glow)">
    <!-- Main Calorie Flame Layer -->
    <path d="M 256,128 
             C 272,168 296,188 316,216 
             C 340,250 344,286 328,322 
             C 308,366 256,388 232,388 
             C 208,388 160,366 160,310 
             C 160,268 188,232 216,204 
             C 212,228 224,248 240,252 
             C 252,256 264,248 268,236 
             C 276,212 264,168 256,128 Z" 
          fill="url(#flameGrad)" />

    <!-- Inner Core Flame Glow -->
    <path d="M 256,236 
             C 264,258 278,272 284,292 
             C 292,316 280,344 256,356 
             C 240,364 220,356 216,336 
             C 212,312 232,284 248,264 
             C 248,276 256,280 260,272 
             C 264,260 260,248 256,236 Z" 
          fill="#FFE600" opacity="0.9" />

    <!-- Nutrition Leaf Overlay (Top Right Accent) -->
    <path d="M 284,148 
             C 328,140 360,168 364,212 
             C 320,224 288,196 284,148 Z" 
          fill="url(#leafGrad)" />
    <path d="M 292,156 C 316,180 340,192 356,196" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Top Glass Highlight Reflection -->
  <path d="M 32,128 C 64,56 128,24 256,24 C 384,24 448,56 480,128 C 380,88 280,88 32,128 Z" fill="url(#glossGrad)" />
</svg>